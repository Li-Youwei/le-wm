defaults:
  - _self_
  - data: libero

output_model_name: lewm
subdir: ${hydra:job.id}

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 224
patch_size: 14
encoder_scale: tiny
dump_object: True

trainer:
  max_epochs: 100
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 128
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 0.05

# CE label smoothing — overridden to 0 in the no-regularization ablation.
label_smoothing: 0.1

wm:
  type: vla_baseline
  embed_dim: 192

predictor:
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.2
  emb_dropout: 0.0
  # Mixture-of-Transformers — when True the FFN in each transformer block has
  # a separate expert per modality (prefix / action / state-query); attention
  # stays shared. Hypothesis: shared FFN causes action prediction and
  # image/state prediction to interfere, especially with multi-token visual
  # prefix. Parameter count grows by ~1.6-2x (3 FFN experts instead of 1).
  use_mot: false

# Projector normalization layer — see CLAUDE.md "Known caveats of switching to
# BatchNorm projector". Default 'layer' reproduces the frozen baseline.
# Switch to 'batch' when sigreg_weight > 0 (LeWM paper Section 3 requires
# BatchNorm because LayerNorm prevents SIGReg from optimizing the latent
# distribution toward isotropic Gaussian). train.py errors out if this
# constraint is violated.
projector:
  norm_type: layer  # 'layer' (baseline) | 'batch' (required when sigreg_weight > 0)

# State-prediction + SIGReg loss weights.
# Default 0 = pure-action baseline (frozen @ 7008f15, fully reproducible).
# Recommended starting weights when both enabled (LeWM paper defaults):
#   pred_weight = 1.0  (no separate weight in paper; implicitly 1.0)
#   sigreg_weight = 0.1  (paper Section 3, λ = 0.1)
loss:
  pred_weight: 0.0       # > 0 enables Q_ag/Q_hd/Q_pr STATE_QUERY tokens + 3 MSE losses
  sigreg_weight: 0.0     # > 0 enables SIGReg on encoder outputs (Algorithm 1 strict)
  # Gripper-aware auxiliary head + MSE loss. When > 0 the predictor grows a
  # small MLP that reads the BOS hidden state and regresses the (H,)
  # gripper-command sequence directly, bypassing FAST tokenization for dim 6.
  # Motivation: diagnostic on libero_object 0% showed FAST joint BPE diluting
  # the gripper signal — predicted gripper command oscillated ±1 while GT
  # stayed constant at -1 for early chunks. The bypass head restores a clean
  # direct signal. At inference eval_libero.py auto-detects the head and
  # overrides actions_phys[..., 6] with its prediction.
  gripper_aux_weight: 0.0
  sigreg:
    kwargs:
      knots: 17
      num_proj: 1024
