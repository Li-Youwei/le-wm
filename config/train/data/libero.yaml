dataset:
  name: libero
  hdf5_dir: ${oc.env:STABLEWM_HOME}/libero
  max_action_tokens: 80
  max_lang_tokens: 25
  img_size: 224
  # 9d: ee_pos(3) + xyzw_quat(4) + gripper_states raw(2).
  # Do NOT mean/abs the gripper — fingers are symmetric around 0, averaging
  # either destroys half the info or zeros out when the sign cancels.
  proprio_dim: 9
  # Ablation switch: set false to drop the language instruction entirely
  # (T5 encoder is not loaded, prefix becomes [z_ag, z_hd, z_pr, BOS, ...]).
  use_language: true
  # State-prediction switch: when true, dataset additionally loads
  # image_agent_future / image_hand_future / proprio_future from the preprocessed
  # HDF5. Old HDF5 files (preprocessed before the state-prediction extension)
  # do not contain these fields — LiberoDataset.__init__ asserts their presence
  # only when this flag is true.
  # Driven automatically by train.py from cfg.loss.pred_weight > 0; do not set
  # this field manually unless you are bypassing the train.py auto-wiring.
  use_state_prediction: false
